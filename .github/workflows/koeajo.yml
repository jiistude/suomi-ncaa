name: Koeajo – kalenterisyötteet

# Vianetsintään: ajetaan vain käsin (Actions → Koeajo → Run workflow).
# Kertoo jokaisen lähteen tilan. Ei tallenna mitään.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  koeajo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hae syötteet
        run: node tyokalut/koeajo.js
