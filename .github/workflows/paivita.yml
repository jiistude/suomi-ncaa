name: Päivitä ottelut

# main-haarassa: hakee ottelut ja julkaisee sivun (docs/) ajastetusti (yöllä tunnin välein)
# sekä jokaisen muutoksen jälkeen.
# Pull requestissa: ajaa saman haun mutta ei julkaise, vaan tallentaa tuloksen
# ajon liitteeksi (Artifacts: esikatselu) tarkistamista varten.
on:
  schedule:
    # Päivitykset käynnistää ensisijaisesti ulkoinen ajastin (cron-job.org, Jannen tili) GitHubin
    # rajapinnan kautta: Suomen aikaa klo 3.17–10.17 tunnin välein sekä 14.17, 18.17 ja 22.17.
    # GitHubin oma ajastus myöhästyy usein tunteja, joten se on tässä vain varmistuksena (UTC).
    - cron: "40 5,15 * * *"
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paivita-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Asenna pdftotext (Arkansasin PDF-pöytäkirjat)
        # Ubuntun pakettipalvelin on joskus hetkellisesti tavoittamattomissa. Yritetään uudelleen,
        # ja jos asennus ei silti onnistu, päivitys jatkuu ilman sitä: vain Arkansasin uudet
        # pöytäkirjat jäävät odottamaan seuraavaa ajoa (ne eivät tallennu välimuistiin virheellisinä).
        continue-on-error: true
        timeout-minutes: 4
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get install -y -qq -o Acquire::Retries=0 -o Acquire::http::Timeout=10 poppler-utils >/dev/null && exit 0
            sleep 10; sudo timeout 60 apt-get update -qq >/dev/null || true
          done
          echo "::warning::pdftotext-asennus epäonnistui, Arkansasin PDF-tilastot ohitetaan tässä ajossa"
          exit 1

      - name: Hae ottelut ja rakenna sivu
        run: node hae.js
        env:
          RAAKA_TALLENNA: ${{ github.event_name == 'pull_request' && 'raaka' || '' }}
          PDF_NAYTE: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Tarkistus (vain pull request)
        if: github.event_name == 'pull_request'
        run: node tyokalut/tarkistus.js

      - name: Tallenna esikatselu (vain pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: esikatselu
          path: |
            docs/
            raaka/
          retention-days: 7

      - name: Julkaise (vain main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Ei muutoksia."
          else
            git commit -m "Päivitetyt ottelutiedot"
            git pull --rebase origin main
            git push
          fi
